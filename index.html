<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>srimaye — my writing</title>
  <style>
    :root {
      --bg: #f2f6fb;
      --paper: #ffffff;
      --ink: #0e2240;
      --muted: #5b7194;
      --accent: #2c5aa0;
      --line: #cfdcee;
      --soft: #e3ecf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      line-height: 1.5;
      text-transform: lowercase;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
    }

    /* ---- header ---- */
    header { margin-bottom: 4rem; }

    .name {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--ink);
    }

    .sub {
      margin: 0.35rem 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* ---- section ---- */
    h2 {
      margin: 0 0 2rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--line);
      font-weight: 500;
      font-size: 2rem;
      color: var(--accent);
    }

    /* ---- each piece ---- */
    .piece { margin-bottom: 3.5rem; }

    .piece h3 {
      margin: 0 0 1rem;
      font-weight: 500;
      font-size: 1.2rem;
    }

    .frame {
      width: 100%;
      height: 760px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      overflow: hidden;
    }

    .frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .frame.empty {
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px dashed var(--line);
      background: var(--soft);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .open {
      display: inline-block;
      margin-top: 0.6rem;
      font-size: 0.85rem;
      color: var(--accent);
      text-decoration: none;
    }
    .open:hover { text-decoration: underline; }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .wrap { padding-top: 2.5rem; }
      h2 { font-size: 1.6rem; }
      .frame { height: 520px; }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <header>
      <h1 class="name">srimaye</h1>
      <p class="sub">student at uchicago</p>
    </header>

    <main>
      <h2>my writing</h2>

      <!--
        TO ADD A PIECE: copy one <article> block below.
        Put the path to your PDF in data-pdf (e.g. "pdfs/my-poem.pdf").
        Leave data-pdf empty to show a placeholder box.
      -->

      <article class="piece">
        <h3>salad day</h3>
        <div class="frame" data-pdf="">salad-day.pdf</div>
      </article>

      <article class="piece">
        <h3>inside jokes with myself</h3>
        <div class="frame" data-pdf="">inside-jokes.pdf</div>
      </article>
    </main>

    <footer>© srimaye</footer>
  </div>

  <script>
    // Turns each data-pdf slot into an embedded PDF (or a placeholder if empty).
    document.querySelectorAll(".frame").forEach((slot) => {
      const src = slot.dataset.pdf.trim();
      if (!src) {
        slot.classList.add("empty");
        slot.textContent = "pdf goes here";
        return;
      }
      const title = slot.closest(".piece").querySelector("h3").textContent;
      const iframe = document.createElement("iframe");
      iframe.src = src + "#view=FitH";
      iframe.title = title;
      iframe.loading = "lazy";
      slot.appendChild(iframe);

      // fallback link — phones don't always show embedded PDFs fully
      const link = document.createElement("a");
      link.className = "open";
      link.href = src;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "open pdf ↗";
      slot.after(link);
    });
  </script>
</body>
</html>
